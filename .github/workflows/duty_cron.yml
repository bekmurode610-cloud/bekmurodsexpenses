name: Automatic Duty Check & Auto-Delete Sweeper

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: tgcloud-duty-sweeper
  cancel-in-progress: false

jobs:
  check-duty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Continuous TGCloud Duty & Deletion Sweeper Loop
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN || 'app8656629226:blHgEYOBi0Er20flQs7SJ7WtCl0WF_YkincshYVindg' }}
        run: |
          mkdir -p .tgcloud
          echo '{"token":"app8656629226:blHgEYOBi0Er20flQs7SJ7WtCl0WF_YkincshYVindg"}' > .tgcloud/credentials
          END=$((SECONDS+18000))
          while [ $SECONDS -lt $END ]; do
            npx --yes @tgcloud/cli run endpoints/check_duty '{}' || true
            sleep 20
          done
